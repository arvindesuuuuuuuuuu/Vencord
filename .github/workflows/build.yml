name: Build DevBuild
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - scripts/installers/**
            - LICENSE
            - package.json
            - pnpm-lock.yaml

# This gives the bot permission to upload/delete releases
permissions:
    contents: write

env:
    FORCE_COLOR: true
    plugins_changed: false

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build --standalone

            - name: Package Windows and Linux installers
              run: pnpm buildInstallers

            - name: Get some values needed for the release
              id: release_values
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Publish/Update DevBuild Release
              # Update this line if you change your username or repo name
              if: github.repository == 'arvindesuuuuuuuuuu/Vencord'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}
              run: |
                  # 1. Delete the old 'devbuild' release and tag (if it exists) so we don't get errors
                  gh release delete devbuild --cleanup-tag -y || true
                  
                  # 2. Create a fresh release named 'devbuild' with the new files
                  gh release create devbuild \
                    dist/VencordInstaller-windows.zip \
                    dist/VencordInstaller-linux.tar.gz \
                    dist/README.md \
                    --title "DevBuild $RELEASE_TAG" \
                    --notes-file dist/README.md \
                    --target $GITHUB_SHA

            - name: Upload DevBuild to builds repo
              if: github.repository == 'Vendicated/Vencord'
              run: |
                  git config --global user.name "$USERNAME"
                  git config --global user.email actions@github.com

                  git clone https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git upload
                  cd upload

                  GLOBIGNORE=.git:.gitignore:README.md:LICENSE
                  rm -rf *
                  cp -r ../dist/* .

                  git add -A

                  if ! git diff --cached --quiet -- plugins.json plugin-readmes.json; then
                      echo "plugins_changed=true" >> $GITHUB_ENV
                  fi

                  git commit -m "Builds for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git
              env:
                  API_TOKEN: ${{ secrets.BUILDS_TOKEN }}
                  GH_REPO: Vencord/builds
                  USERNAME: GitHub-Actions

            - name: Redeploy vencord.dev if plugin data changed
              if: github.repository == 'Vendicated/Vencord' && env.plugins_changed == 'true'
              run:
                curl --fail --silent --show-error -X POST "$CLOUDFLARE_DEPLOY_HOOK"
              env:
                  CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}

